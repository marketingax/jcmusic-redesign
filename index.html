<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JC Music Enterprise | Coming Soon</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --gold: #D4AF37;
    --gold-bright: #FFD700;
    --black: #0A0A0A;
    --dark-grey: #1A1A1A;
    --text-white: #F5F5F5;
    --text-dim: #A0A0A0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black);
    color: var(--text-white);
    font-family: 'Georgia', 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 560px; }
  .logo-img { max-width: 220px; margin-bottom: 36px; }
  h1 {
    font-size: 2rem;
    letter-spacing: 2px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  p {
    color: var(--text-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .rule {
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 28px auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo-img" src="assets/JC+MUSIC+ENTERPRISE++LOGO+.png" alt="JC Music Enterprise Logo">
    <h1>Coming Soon</h1>
    <div class="rule"></div>
    <p>JC Music Enterprise is between seasons right now.</p>
    <p>Check back soon for piano lessons, scoring services, and Prime Hour.</p>
  </div>
</body>
</html>
